name: Build and test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core tests
        run: swift test -c release -Xswiftc -enable-testing
      - name: Project is up to date
        run: python3 scripts/generate_project.py && git diff --exit-code
      - name: Simulator build
        run: xcodebuild -project FitheWake.xcodeproj -scheme FitheWake -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
